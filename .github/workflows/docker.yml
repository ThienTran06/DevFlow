name : DevFlow CI

on:
  push

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
         java-version: '17'
         distribution: 'temurin'

      - name: Run tests
        run: ./mvnw test

