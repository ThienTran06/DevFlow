spring.application.name=devflow
spring.profiles.default=local
spring.config.import=optional:file:.env[.properties]
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
jwt.access-secret=${JWT_ACCESS_SECRET}
jwt.refresh-secret=${JWT_REFRESH_SECRET}
app.frontend.verify-email-url=${APP_VERIFY_EMAIL_URL:http://localhost:3000/verify-email}
app.frontend.reset-password-url=${APP_RESET_PASSWORD_URL:http://localhost:3000/reset-password}
spring.